<section class="image-text-section" id="intro" data-content-bind="intro">
  <div class="container image-text-section__inner">
    <div class="image-text-section__content js-fade-up">
      <div
        data-component="section-heading"
        data-bind="intro-eyebrow"
        data-eyebrow=""
        data-title=""
      ></div>
      <p class="image-text-section__description" data-bind="intro-description"></p>
    </div>
    <figure class="image-text-section__media js-fade-in">
      <img data-bind="intro-image" src="../assets/images/intro.svg" alt="" loading="lazy" />
    </figure>
  </div>
</section>
