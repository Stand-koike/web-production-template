<section class="hero" id="hero" data-content-bind="hero">
  <img class="hero__image" data-bind="hero-image" src="../assets/images/hero.svg" alt="" />
  <div class="hero__overlay">
    <div class="hero__content container" data-animate="hero">
      <p class="section-heading__eyebrow" data-bind="hero-eyebrow"></p>
      <h1 class="hero__title" data-bind="hero-title"></h1>
      <p class="hero__description" data-bind="hero-description"></p>
      <div
        data-component="button"
        data-variant="primary"
        data-bind="hero-cta"
        data-label=""
        data-href="#intro"
      ></div>
    </div>
  </div>
</section>
