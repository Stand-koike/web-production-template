<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- PAGE_TITLE --></title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <!--
    下層ページシェル雛形（コピーして src/pages/{name}.html にする）
    規約: docs/page-shell.md
    - body: data-page（必須）。高さ変化 UI なら data-motion="height-ui"
    - main: class="site-main"（全幅）
    - ラッパーにアートボード固定幅を付けない
    - __SRC_BASE__ / __ASSET_BASE__ は必須
  -->
  <body data-page="<!-- PAGE_ID -->">
    <div data-include="../sections/header.html"></div>
    <main class="site-main">
      <!-- <div data-include="../sections/{page}-{role}.html"></div> -->
    </main>
    <div data-include="../sections/footer.html"></div>
    <script>
      window.__SRC_BASE__ = "../";
      window.__ASSET_BASE__ = "../../assets/";
    </script>
    <script type="importmap">
      {
        "imports": {
          "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/+esm",
          "gsap/ScrollTrigger": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/ScrollTrigger/+esm"
        }
      }
    </script>
    <script src="../scripts/load-data.js"></script>
    <script src="../scripts/load-sections.js"></script>
    <script type="module" src="../scripts/animation.js"></script>
  </body>
</html>
